# ===== LAB211 Simulator config =====
# Change baseUrl if your project name/port is different.
baseUrl=http://localhost:8080/LAB211Web3

# LOGIN_ONLY or PLACE_ORDER
mode=PLACE_ORDER

# Number of parallel workers
concurrency=10

# Total scenarios to run
# Example: 100 means the simulator will attempt 100 login/order flows.
totalTasks=50

# Put variant IDs that actually exist and still have stock.
# You can get them from Product Variant List or from SQL.
variantIds=18,25,41,56,72,80,91,105

# Quantity range per order
minQuantity=1
maxQuantity=1

# Shipping / payment data used by /checkout
receiverPhone=0901234567
shippingAddress=FPT University, Quy Nhon, Gia Lai
paymentMethods=COD,Bank Transfer

connectTimeoutSeconds=15
requestTimeoutSeconds=30

# users.csv must be in the same folder as this config file unless you use another relative path.
usersFile=users.csv
reportFile=simulator-report.csv
